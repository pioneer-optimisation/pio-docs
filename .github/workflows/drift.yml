# Docs gates (ENG-1101, ENG-1259), on every PR and daily.
#
# Docs follow SDK releases, not SDK main. sdk-version.json names the release
# these docs describe; pio-unity-sdk docs-sync.yml opens a PR moving it (and
# every generated page) to each new release. This workflow checks that:
# - generated content (snippets, install manifest, API reference, changelog)
#   matches the release the docs claim, so a hand edit or a half sync fails;
# - the claim is the latest SDK release, with a 24h window for the sync PR;
# - no SDK version or private git URL is typed by hand;
# - plus the copy, page-inventory and link checks.
# The docs-sync PR merges itself once these pass.
name: docs-drift

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Drift against the claimed SDK release
    # Stays GitHub-hosted: this repo is public, so hosted minutes are free,
    # while a Depot runner would bill them.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pio-unity-sdk is private; pio-docs is public, so the default token
      # cannot read it. Mint a short-lived app token scoped to that one repo
      # (same org app the SDK's release workflow uses).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: sdk-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: pioneer-optimisation
          repositories: pio-unity-sdk

      # The generators live in pio-unity-sdk and render from a tag, so main's
      # tooling is right for any release. A PR whose branch also exists in
      # pio-unity-sdk is a coupled change: use that branch's tooling.
      - name: Pick the SDK tooling ref
        id: tooling
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [ -n "$HEAD_REF" ] && gh api "repos/pioneer-optimisation/pio-unity-sdk/branches/$(jq -rn --arg b "$HEAD_REF" '$b|@uri')" >/dev/null 2>&1; then
            ref="$HEAD_REF"
          fi
          echo "SDK tooling ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pio-docs

      # Full history and tags: the generators read the claimed release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pioneer-optimisation/pio-unity-sdk
          ref: ${{ steps.tooling.outputs.ref }}
          token: ${{ steps.sdk-token.outputs.token }}
          fetch-depth: 0
          filter: blob:none
          path: pio-unity-sdk

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Test the release gates
        working-directory: pio-docs
        run: node --test bin/release-gates.test.mjs

      - name: Generated content matches the claimed SDK release
        working-directory: pio-unity-sdk
        run: node scripts/docs-sync.mjs --docs ../pio-docs --check

      - name: Claimed release is the latest (24h sync window)
        working-directory: pio-docs
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: node bin/sdk-version-check.mjs

      - name: No hand-written SDK pins
        working-directory: pio-docs
        run: node bin/pin-lint.mjs

      - name: Brand lint (baseline stays empty)
        working-directory: pio-docs
        run: |
          if [ -s config/brand_lint_baseline.txt ]; then
            echo "brand-lint baseline must stay empty (AGENTS.md); found entries:"
            cat config/brand_lint_baseline.txt
            exit 1
          fi
          node bin/brand-lint

      - name: Page inventory is current (bin/pages)
        working-directory: pio-docs
        run: node bin/pages --check

      - name: No broken links
        working-directory: pio-docs
        run: npx --yes mint@4.2.835 broken-links

  # The docs-sync PR is generated content only, and the checks above are its
  # whole review: merge it once they pass, pinned to the head they checked.
  # Not a required check, so the job-level `if` skips nothing that gates.
  automerge:
    name: Merge the docs-sync PR
    needs: drift
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'bot/sdk-docs-sync-v')
      && github.event.pull_request.user.login == 'pio-release-please[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
